#
# Default values for Edgex.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

imagePullSecrets: []
# supply a list of secret names (in the current namespace) of type docker-registry

expose:
  type:
    # Option value: ClusterIP/NodePort/LoadBalancer
    core:
      command: ClusterIP
      data:  ClusterIP
      metadata: ClusterIP
      keeper: LoadBalancer
    support:
      notifications: ClusterIP
      scheduler: ClusterIP
    ui: LoadBalancer
    system: ClusterIP
    datebase: ClusterIP
    ekuiper: ClusterIP
    mqttbroker: ClusterIP

# edgex defines a set of configuration properties for application-level concerns
edgex:

  # app defines a single point in naming/referring to an application. For each application, the value
  # define its label name, resource name or base of the resource name, and service name.
  app:
    core:
      common_config: edgex-core-common-config-bootstrapper
      command: edgex-core-command
      data: edgex-core-data
      metadata: edgex-core-metadata
    support:
      notifications: edgex-support-notifications
      scheduler: edgex-support-scheduler
    ui: edgex-ui
    keeper: edgex-core-keeper
    database: edgex-postgres
    ekuiper: edgex-kuiper
    mqttbroker: edgex-mqtt-broker

  # image defines configuration properties for docker-image-level concerns
  image:
    core:
      common_config:
        repository: domain:5000/edgex/core-common-config-bootstrapper
        tag: "4.0.0"
        pullPolicy: IfNotPresent
      command:
        repository: domain:5000/edgex/core-command
        tag: "4.0.0"
        pullPolicy: IfNotPresent
      data:
        repository: domain:5000/edgex/core-data
        tag: "4.0.0"
        pullPolicy: IfNotPresent
      metadata:
        repository: domain:5000/edgex/core-metadata
        tag: "4.0.0"
        pullPolicy: IfNotPresent
    support:
      notifications:
        repository: domain:5000/edgex/support-notifications
        tag: "4.0.0"
        pullPolicy: IfNotPresent
      scheduler:
        repository: domain:5000/edgex/support-scheduler
        tag: "4.0.0"
        pullPolicy: IfNotPresent
    ui:
      repository: domain:5000/edgex/edgex-ui
      tag: "4.0.0"
      pullPolicy: IfNotPresent
    keeper:
      repository: domain:5000/edgex/core-keeper
      tag: "4.0.0"
      pullPolicy: IfNotPresent        
    database:
      repository: domain:5000/postgres
      tag: "16.3-alpine3.20"
      pullPolicy: IfNotPresent
    ekuiper:
      repository: domain:5000/lfedge/ekuiper
      tag: "2.1.5"
      pullPolicy: IfNotPresent
    mqttbroker:
      repository: domain:5000/eclipse-mosquitto
      tag: "2.0.20"
      pullPolicy: IfNotPresent

  # port defines configuration properties for container, target and host ports
  port:
    core:
      data: 59880
      metadata: 59881
      command: 59882
    support:
      notifications: 59860
      scheduler: 59861
    system: 58890
    ui: 4000
    keeper: 59800
    ekuiper: 59720
    mqttbroker: 1883

  # Duplicate default IP binding choice of docker-compose
  hostPortInternalBind: 127.0.0.1
  hostPortExternalBind: 0.0.0.0

  # replicas defines the number of replicas in a Deployment for the respective application
  replicas:
    core:
      common_config: 1
      command: 1
      data: 1
      metadata: 1
    support:
      notifications: 1
      scheduler: 1
    ui: 1
    system: 1
    keeper: 1
    database: 1
    ekuiper: 1
    mqttbroker: 0

  # UID/GID for container user
  security:
    enabled: false
    runAsUser: 2002
    runAsGroup: 2001
    tlsHost: edgex

  # resources defines the cpu and memory limits and requests for the respective application
  resources:
    core:
      common_config:
        enforceLimits: false
        limits:
          cpu: 1
          memory: 512Mi
        requests:
          cpu: 0.5
          memory: 256Mi
      command:
        enforceLimits: false
        limits:
          cpu: 1
          memory: 512Mi
        requests:
          cpu: 0.5
          memory: 256Mi
      data:
        enforceLimits: false
        limits:
          cpu: 1
          memory: 512Mi
        requests:
          cpu: 0.5
          memory: 256Mi
      metadata:
        enforceLimits: false
        limits:
          cpu: 1
          memory: 512Mi
        requests:
          cpu: 0.5
          memory: 256Mi
    support:
      notifications:
        enforceLimits: false
        limits:
          cpu: 1
          memory: 512Mi
        requests:
          cpu: 0.5
          memory: 256Mi
      scheduler:
        enforceLimits: false
        limits:
          cpu: 1
          memory: 512Mi
        requests:
          cpu: 0.5
          memory: 256Mi
    ui:
      enforceLimits: false
      limits:
        cpu: 1
        memory: 512Mi
      requests:
        cpu: 0.5
        memory: 256Mi
    system:
      enforceLimits: false
      limits:
        cpu: 1
        memory: 512Mi
      requests:
        cpu: 0.5
        memory: 256Mi
    keeper:
      enforceLimits: false
      limits:
        cpu: 1
        memory: 512Mi
      requests:
        cpu: 0.5
        memory: 256Mi
    database:
      enforceLimits: false
      limits:
        cpu: 1
        memory: 512Mi
      requests:
        cpu: 0.5
        memory: 256Mi
    ekuiper:
      enforceLimits: false
      limits:
        cpu: 1
        memory: 512Mi
      requests:
        cpu: 0.5
        memory: 256Mi
    mqttbroker:
      enforceLimits: false
      limits:
        cpu: 1
        memory: 512Mi
      requests:
        cpu: 0.5
        memory: 256Mi
  storage:
    useHostPath: true

    # nonSharedVolumesClassName used for services that does not share a storage volume with other services.
    nonSharedVolumesClassName: "rook-ceph-block"
    nonSharedVolumesAccessMode: "ReadWriteOnce"

    # sharedVolumesClassName used for services that share a storage volume
    sharedVolumesClassName: "rook-cephfs"
    # If this value is set to "ReadWriteOnce" it will trigger pod affinity rules.
    sharedVolumesAccessMode: "ReadWriteMany"

  features:
    # Available messagebus options: redis|mqtt|nats
    messagebusbackend: mqtt
    # MQTT broker address
    mqttBrokerAddress: ""
    # Writable pipeline functions HTTP export parameter URL
    httpExportURL: ""
    enableHostPort: false
