apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    org.edgexfoundry.service: {{.Values.edgex.app.keeper}}
  name: {{.Values.edgex.app.keeper}}
spec:
  replicas: {{.Values.edgex.replicas.keeper}}
  selector:
    matchLabels:
      org.edgexfoundry.service: {{.Values.edgex.app.keeper}}
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        org.edgexfoundry.service: {{.Values.edgex.app.keeper}}
    spec:
    {{- if and (eq .Values.edgex.security.enabled true) (or (eq .Values.edgex.storage.sharedVolumesAccessMode "ReadWriteOnce") (eq .Values.edgex.storage.useHostPath true))}}
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  org.edgexfoundry.service: {{ .Values.edgex.app.secretstoresetup}}
              topologyKey: "kubernetes.io/hostname"
    {{- end}}
    {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
      {{- range .Values.imagePullSecrets }}
      - name: {{ . }}
      {{- end }}
    {{- end }}
      automountServiceAccountToken: false
      containers:
      - name: {{.Values.edgex.app.keeper}}
        image: {{.Values.edgex.image.keeper.repository}}:{{.Values.edgex.image.keeper.tag}}
        imagePullPolicy: {{.Values.edgex.image.keeper.pullPolicy}}
      {{- if .Values.edgex.security.enabled }}
        command: ["/edgex-init/keeper_wait_install.sh"]
      {{- end }}
        args: ["agent", "-ui", "-bootstrap", "-server", "-client", "0.0.0.0"]
        ports:
        - containerPort: {{.Values.edgex.port.keeper}}
          name: "http"
        {{- if .Values.edgex.features.enableHostPort}}
          hostPort: {{.Values.edgex.port.keeper}}
          hostIP: {{.Values.edgex.hostPortExternalBind}}
        {{- end}}
      {{- if .Values.edgex.security.enabled }}
        env:
        - name: EDGEX_USER
          value: "{{ .Values.edgex.security.runAsUser }}"
        - name: EDGEX_GROUP
          value: "{{ .Values.edgex.security.runAsGroup }}"
        - name: STAGEGATE_REGISTRY_ACL_BOOTSTRAPTOKENPATH
          value: /tmp/edgex/secrets/keeper-acl-token/bootstrap_token.json
        - name: STAGEGATE_REGISTRY_ACL_MANAGEMENTTOKENPATH
          value: /tmp/edgex/secrets/keeper-acl-token/mgmt_token.json
        - name: STAGEGATE_REGISTRY_ACL_SENTINELFILEPATH
          value: /keeper/config/keeper_acl_done
        - name: EDGEX_ADD_REGISTRY_ACL_ROLES
          value: {{.Values.edgex.security.addkeeperRoles}}
      {{- end }}
        envFrom:
        - configMapRef:
            name: edgex-common-variables
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
        startupProbe:
          tcpSocket:
            port: {{.Values.edgex.port.keeper}}
          periodSeconds: 1
          failureThreshold: 120
        livenessProbe:
          tcpSocket:
            port: {{.Values.edgex.port.keeper}}
        volumeMounts:
        - mountPath: /keeper/config
          name: keeper-config
        - mountPath: /keeper/data
          name: keeper-data
        {{- if .Values.edgex.security.enabled }}
        - mountPath: /edgex-init
          name: edgex-init
        - mountPath: /tmp/edgex/secrets
          name: edgex-secrets
        - mountPath: /tmp/edgex/secrets/keeper-acl-token
          name: keeper-acl-token
        {{- end }}
      {{- if .Values.edgex.resources.keeper.enforceLimits }}
        resources:
          limits:
            memory: {{ .Values.edgex.resources.keeper.limits.memory }}
            cpu: {{ .Values.edgex.resources.keeper.limits.cpu }}
          requests:
            memory: {{ .Values.edgex.resources.keeper.requests.memory }}
            cpu: {{ .Values.edgex.resources.keeper.requests.cpu }}
      {{- end}}

      hostname: {{.Values.edgex.app.keeper}}
      restartPolicy: Always
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      volumes:
      - name: keeper-config
        persistentVolumeClaim:
          claimName: keeper-config
      - name: keeper-data
        persistentVolumeClaim:
          claimName: keeper-data
      {{- if .Values.edgex.security.enabled }}
      - name: edgex-init
        persistentVolumeClaim:
          claimName: edgex-init
      - name: keeper-acl-token
        persistentVolumeClaim:
          claimName: keeper-acl-token
      - name: edgex-secrets
        persistentVolumeClaim:
          claimName: edgex-secrets
      {{- end}}
